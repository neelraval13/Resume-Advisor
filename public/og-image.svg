<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Paper background -->
  <rect width="1200" height="630" fill="#F1EDE4"/>

  <!-- Subtle hairline rule top -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#D3CCB9" stroke-width="1"/>

  <!-- Mono caps eyebrow label -->
  <text x="80" y="125" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="3" fill="#8A8478" font-weight="500">
    JOGEN · 助言
  </text>

  <!-- Main title -->
  <text x="80" y="265" font-family="Georgia, serif" font-size="92" font-weight="400" fill="#17140F">
    Tailored resume advice
  </text>
  <text x="80" y="370" font-family="Georgia, serif" font-size="92" font-weight="400" fill="#17140F">
    from <tspan fill="#A8421C" font-style="italic">Claude</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="455" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#5C564A">
    Line edits, skill gaps, red flags. No fabrication.
  </text>

  <!-- Hairline rule bottom + footer -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#D3CCB9" stroke-width="1"/>
  <text x="80" y="575" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="3" fill="#8A8478" font-weight="500">
    PRIVATE BETA · BUILT WITH ANTHROPIC CLAUDE
  </text>
</svg>
